name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Scientific evidence is hash-bound to earlier exact commits.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-suffix: py${{ matrix.python-version }}
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --locked --extra dev --extra experiment --python ${{ matrix.python-version }}
      - run: uv run --python ${{ matrix.python-version }} ruff check src tests tools examples
      - run: uv run --python ${{ matrix.python-version }} ruff format --check src tests tools examples
      - run: uv run --python ${{ matrix.python-version }} pytest -q
      - run: uv run --python ${{ matrix.python-version }} --extra dev python tools/build_all.py --check
      - run: uv build
