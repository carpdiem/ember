name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --locked --extra dev --python 3.11
      - run: uv run --python 3.11 pytest -q
      - run: uv run --python 3.11 --extra dev python tools/build_all.py --check
      - run: uv build
