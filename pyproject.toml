[project]
name = "ember-palettes"
version = "0.3.0"
description = "Redshift-aware terminal, chart, heatmap, and UI color palettes"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Michael Woods" }]
keywords = ["color-palette", "matplotlib", "night-light", "redshift", "terminal-theme"]
dependencies = ["matplotlib>=3.8", "numpy>=1.26"]

[project.urls]
Homepage = "https://github.com/carpdiem/ember"
Repository = "https://github.com/carpdiem/ember"
Issues = "https://github.com/carpdiem/ember/issues"

[project.optional-dependencies]
dev = [
  "pillow>=10",
  "pytest>=8",
  "ruff>=0.14",
  "scipy>=1.12",
  "tomli>=2; python_version < '3.11'",
]
experiment = [
  "colour-science>=0.4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ember"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
