[project]
name = "redshift-safe-palettes"
version = "0.1.0"
description = "Terminal, categorical, and sequential palettes engineered for warm-shifted displays"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Michael Woods" }]
dependencies = ["matplotlib>=3.8", "numpy>=1.26"]

[project.optional-dependencies]
dev = [
  "pillow>=10",
  "pytest>=8",
  "scipy>=1.12",
  "tomli>=2; python_version < '3.11'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redshift_safe"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
